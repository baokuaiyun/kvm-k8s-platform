# 集群告警规则
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
spec:
  groups:
  - name: node
    rules:
    - alert: NodeDown
      expr: up == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "节点 {{ $labels.node }} 不可用"
    - alert: HighCPUUsage
      expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "节点 {{ $labels.instance }} CPU 使用率超过 85%"
    - alert: HighMemoryUsage
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "节点 {{ $labels.instance }} 内存使用率超过 90%"
  - name: pod
    rules:
    - alert: PodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} 频繁重启"
    - alert: PodPending
      expr: kube_pod_status_phase{phase="Pending"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} 长时间 Pending"
  - name: certificate
    rules:
    - alert: CertificateExpiring
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "证书 {{ $labels.name }} 7 天内到期"
  - name: storage
    rules:
    # ---- PV/PVC 容量 ----
    - alert: PVCNearlyFull
      expr: |
        kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 使用率 >85%"
    - alert: PVCCriticalFull
      expr: |
        kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.95
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 使用率 >95%，即将写满"
    # 预测 24h 内写满（基于 6h 可用空间线性外推）
    - alert: PVCPredictFull
      expr: |
        predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
          and kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.60
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 预计 24h 内写满"
    # inode 将满（文件数密集卷，如 registry/gitaly）
    - alert: PVCInodesNearlyFull
      expr: |
        kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes > 0.85
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} inode 使用率 >85%"
    # 扩容请求已下发但卷容量未跟上（CSI resizer 卡住 / 需重启 Pod 完成 fs resize）
    - alert: PVCResizeStuck
      expr: |
        kube_persistentvolumeclaim_resource_requests_storage_bytes
          > on(namespace, persistentvolumeclaim) kubelet_volume_stats_capacity_bytes
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 扩容未生效（requested > capacity）"
    # PV 进入 Failed 阶段
    - alert: PersistentVolumeFailed
      expr: kube_persistentvolume_status_phase{phase="Failed"} == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "PV {{ $labels.persistentvolume }} 状态 Failed"
    # ---- Longhorn 卷健康（0=unknown,1=healthy,2=degraded,3=faulted）----
    - alert: LonghornVolumeDegraded
      expr: longhorn_volume_robustness == 2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Longhorn 卷 {{ $labels.volume }} 降级（副本不足）"
    - alert: LonghornVolumeFaulted
      expr: longhorn_volume_robustness == 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Longhorn 卷 {{ $labels.volume }} 故障，数据有风险"
    - alert: LonghornNodeStorageHigh
      expr: |
        longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes > 0.8
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Longhorn 节点 {{ $labels.node }} 存储使用率 >80%"
    - alert: LonghornBackupTargetUnreachable
      expr: longhorn_backup_target_available == 0
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: "Longhorn 备份目标不可达，异地备份已中断"
    # ---- 备份时效（Velero / CNPG）----
    - alert: VeleroBackupFailure
      expr: increase(velero_backup_failure_total[6h]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Velero 备份失败（schedule={{ $labels.schedule }}）"
    - alert: VeleroBackupStale
      expr: time() - velero_backup_last_successful_timestamp > 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "Velero 超过 48h 无成功备份"
    - alert: CNPGBackupStale
      expr: time() - cnpg_collector_last_available_backup_timestamp > 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "CNPG 集群 {{ $labels.cluster }} 超过 48h 无可用备份"
