# ResourceSet（D2 模式）：集群级策略/安全组件（需要 cluster-admin）
# inputs 的 ${ARTIFACT_TAG}/${ENVIRONMENT} 由 clusters/<c>/tenants.yaml 的 postBuild.substituteFrom 注入。
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: policies
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
    - tenant: "kyverno"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
    - tenant: "sealed-secrets"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: "infra"
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      imagePullSecrets:
        - name: harbor-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-policies-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/harbor-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: Secret
      metadata:
        name: cosign-pub
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: policies
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        insecure: true
        secretRef:
          name: harbor-auth
        url: "oci://harbor.test.baokuaiyun.com/baokuaiyun/<< inputs.tenant >>"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          secretRef:
            name: cosign-pub
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: policies
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        prune: true
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: policies
        path: "./overlays/<< inputs.environment >>"
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
