# ResourceSet 样板：把共享组件按 inputs 渲染到各"组件命名空间"
# 源=Harbor OCI；verify=key-based cosign(secretRef)；跨 ns 凭据用 copyFrom。
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
    - tenant: "cert-manager"
      tag: "latest"
      environment: "drill"
    - tenant: "monitoring"
      tag: "latest"
      environment: "drill"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: flux-admin
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["*"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-admin
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: flux-admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/harbor-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: Secret
      metadata:
        name: cosign-pub
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: infra
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        insecure: true
        secretRef:
          name: harbor-auth
        url: "oci://harbor.test.baokuaiyun.com/baokuaiyun/<< inputs.tenant >>"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          secretRef:
            name: cosign-pub
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        interval: 30m
        prune: true
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./overlays/<< inputs.environment >>"
