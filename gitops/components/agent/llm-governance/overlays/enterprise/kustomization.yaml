apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gc-gov
resources:
  - ../../base
patches:
  - target:
      kind: GasCity
      name: gov
    patch: |-
      - op: replace
        path: /spec/controller/replicas
        value: 1
      - op: replace
        path: /spec/controller/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/controller/persistence/size
        value: 50Gi
      - op: replace
        path: /spec/dolt/persistence/size
        value: 100Gi
      - op: replace
        path: /spec/dolt/resources/limits/memory
        value: 8Gi
      - op: replace
        path: /spec/session/k8s/memoryLimit
        value: 16Gi
