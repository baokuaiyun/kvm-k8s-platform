# Grafana 入口：挂平台 kgateway Gateway（listener=https）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.test.baokuaiyun.com
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80