# 集群告警规则
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: node
    rules:
    - alert: NodeDown
      expr: up == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: 节点 {{ $labels.node }} 不可用
        description: 节点不可用，其上工作负载受影响甚至中断。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#nodedown
    - alert: HighCPUUsage
      expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m]))
        * 100) > 85
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 节点 {{ $labels.instance }} CPU 使用率超过 85%
        description: 节点 CPU 持续高，可能导致服务延迟上升。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#highcpuusage
    - alert: HighMemoryUsage
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
        > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 节点 {{ $labels.instance }} 内存使用率超过 90%
        description: 节点内存持续高，接近 OOM 风险。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#highmemoryusage
  - name: compute
    rules:
    - alert: CPUThrottlingHigh
      expr: |
        sum by (namespace, pod, container) (increase(container_cpu_cfs_throttled_periods_total[5m]))
        / sum by (namespace, pod, container) (increase(container_cpu_cfs_periods_total[5m])) > 0.5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 容器 {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU 限流 >50%
        description: 容器长期被 CFS 限流，说明 CPU limits 过紧或负载过高，延迟会上升。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#cputhrottlinghigh
    - alert: NodeAllocatableOvercommit
      expr: |
        sum by (node) (kube_pod_container_resource_requests{resource="cpu"})
        / sum by (node) (kube_node_status_allocatable{resource="cpu"}) > 2
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 节点 {{ $labels.node }} CPU requests 超分 >2x
        description: 节点 CPU requests 超过可分配量 2 倍，突发时争抢严重。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#nodeallocatableovercommit
    - alert: NodeMemoryOvercommit
      expr: |
        sum by (node) (kube_pod_container_resource_requests{resource="memory"})
        / sum by (node) (kube_node_status_allocatable{resource="memory"}) > 1.5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 节点 {{ $labels.node }} 内存 requests 超分 >1.5x
        description: 节点内存 requests 超额，OOM 风险升高。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#nodememoryovercommit
    - alert: QuotaNearFull
      expr: |
        kube_resourcequota{type="used"}
        / on(namespace, resource, resourcequota) group_left
        kube_resourcequota{type="hard"} > 0.9
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 命名空间 {{ $labels.namespace }} 配额 {{ $labels.resource }} 使用 >90%
        description: 资源配额接近上限，继续申请会被拒绝。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#quotanearfull
    - alert: UnschedulablePods
      expr: kube_pod_status_unschedulable > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 存在无法调度的 Pod（{{ $labels.namespace }}/{{ $labels.pod }}）
        description: Pod 长时间不可调度（资源不足/亲和/污点/PVC），需关注容量与调度约束。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#unschedulablepods
  - name: pod
    rules:
    - alert: PodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Pod {{ $labels.pod }} 频繁重启
        description: 容器频繁重启，服务可能不稳定。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#podcrashlooping
    - alert: PodPending
      expr: kube_pod_status_phase{phase="Pending"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Pod {{ $labels.pod }} 长时间 Pending
        description: Pod 长时间无法调度，服务无法就绪。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#podpending
  - name: certificate
    rules:
    - alert: CertificateExpiring
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: 证书 {{ $labels.name }} 7 天内到期
        description: 证书即将到期，到期后入口/服务将中断。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#certificateexpiring
  - name: storage
    rules:
    - alert: PVCNearlyFull
      expr: 'kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
        > 0.85

        '
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 使用率
          >85%
        description: 持久卷使用率高，需清理或扩容。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#pvcnearlyfull
    - alert: PVCCriticalFull
      expr: 'kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
        > 0.95

        '
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 使用率
          >95%，即将写满
        description: 持久卷即将写满，可能导致服务不可用或数据损坏。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#pvccriticalfull
    - alert: PVCPredictFull
      expr: "predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) <\
        \ 0\n  and kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes\
        \ > 0.60\n"
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 预计
          24h 内写满
        description: 按增长趋势预计 24h 内写满，需提前处理。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#pvcpredictfull
    - alert: PVCInodesNearlyFull
      expr: 'kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes > 0.85

        '
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} inode
          使用率 >85%
        description: 持久卷 inode 将满（文件数密集），新文件写入会失败。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#pvcinodesnearlyfull
    - alert: PVCResizeStuck
      expr: "kube_persistentvolumeclaim_resource_requests_storage_bytes\n  > on(namespace,\
        \ persistentvolumeclaim) kubelet_volume_stats_capacity_bytes\n"
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 扩容未生效（requested
          > capacity）
        description: 扩容请求已下发但卷容量未跟上，需完成 fs resize。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#pvcresizestuck
    - alert: PersistentVolumeFailed
      expr: kube_persistentvolume_status_phase{phase="Failed"} == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: PV {{ $labels.persistentvolume }} 状态 Failed
        description: PV 进入 Failed，数据访问有风险。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#persistentvolumefailed
    - alert: LonghornVolumeDegraded
      expr: longhorn_volume_robustness == 2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Longhorn 卷 {{ $labels.volume }} 降级（副本不足）
        description: Longhorn 卷副本不足，冗余下降。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#longhornvolumedegraded
    - alert: LonghornVolumeFaulted
      expr: longhorn_volume_robustness == 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Longhorn 卷 {{ $labels.volume }} 故障，数据有风险
        description: Longhorn 卷故障，数据有丢失风险。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#longhornvolumefaulted
    - alert: LonghornNodeStorageHigh
      expr: 'longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes
        > 0.8

        '
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Longhorn 节点 {{ $labels.node }} 存储使用率 >80%
        description: Longhorn 节点存储使用率高，需清理或扩容。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#longhornnodestoragehigh
    - alert: LonghornBackupTargetUnreachable
      expr: longhorn_backup_target_available == 0
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: Longhorn 备份目标不可达，异地备份已中断
        description: Longhorn 备份目标不可达，异地备份中断。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#longhornbackuptargetunreachable
    - alert: VeleroBackupFailure
      expr: increase(velero_backup_failure_total[6h]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Velero 备份失败（schedule={{ $labels.schedule }}）
        description: Velero 备份失败，请检查对象存储与任务。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#velerobackupfailure
    - alert: VeleroBackupStale
      expr: time() - velero_backup_last_successful_timestamp > 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: Velero 超过 48h 无成功备份
        description: 超过 48h 无成功备份，存在数据保护缺口。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#velerobackupstale
    - alert: CNPGBackupStale
      expr: time() - cnpg_collector_last_available_backup_timestamp > 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: CNPG 集群 {{ $labels.cluster }} 超过 48h 无可用备份
        description: CNPG 集群超过 48h 无可用备份，存在数据保护缺口。
        runbook_url: https://baokuaiyun.com/observability-runbooks/#cnpgbackupstale
