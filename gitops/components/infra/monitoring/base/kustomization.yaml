apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # 指标/可视化（kube-prometheus-stack）
  - ocirepository-chart.yaml
  - helmrelease.yaml
  - grafana-route.yaml
  # 日志（Loki + Grafana Alloy）
  - ocirepository-loki.yaml
  - helmrelease-loki.yaml
  - ocirepository-alloy.yaml
  - helmrelease-alloy.yaml
  # 探测（blackbox-exporter + Probe）
  - ocirepository-blackbox.yaml
  - helmrelease-blackbox.yaml
  - blackbox-probes.yaml
  # 告警（规则 + 路由 + sink）
  - alert-rules.yaml
  - alertmanagerconfig.yaml
  - alert-sink.yaml