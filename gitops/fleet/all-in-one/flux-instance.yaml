# 集群模式 all-in-one 的 FluxInstance（薄：只声明期望态来源与集群画像）
# 说明：distribution 走 Harbor OCI（镜像源镜像 + cosign 验签）；集群期望态由
#       ResourceSet（tenants/* + render-stack）下发，本文件暂不声明 sync。
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: harbor.test.baokuaiyun.com/baokuaiyun/fluxcd
    variant: upstream-alpine
    artifact: oci://harbor.test.baokuaiyun.com/baokuaiyun/flux-operator-manifests:latest
    artifactPullSecret: harbor-auth
    imagePullSecret: harbor-auth
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    multitenant: true
    tenantDefaultServiceAccount: flux
    networkPolicy: true
    domain: cluster.local