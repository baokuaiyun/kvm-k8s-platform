  - ghcr.io/fluxcd/kustomize-controller:v1.9.6              harbor.test.baokuaiyun.com/baokuaiyun/kustomize-controller:v1.9.6
  - ghcr.io/fluxcd/helm-controller:v1.6.5                   harbor.test.baokuaiyun.com/baokuaiyun/helm-controller:v1.6.5
  - ghcr.io/fluxcd/notification-controller:v1.9.4           harbor.test.baokuaiyun.com/baokuaiyun/notification-controller:v1.9.4
  - ghcr.io/fluxcd/source-watcher:v2.2.4                    harbor.test.baokuaiyun.com/baokuaiyun/source-watcher:v2.2.4
# OCI 制品（非镜像）：flux-operator-manifests（distribution.artifact）
