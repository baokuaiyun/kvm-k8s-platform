# 规范 StorageClass（prod/阿里云 ECS）：与 drill 同名 app-storage，后端换成云盘 ESSD
# 前置：安装阿里云云盘 CSI（见 docs/alicloud-deployment.md）
# 由 storage/apply.sh 渲染 __STORAGE_CLASS__ 后 apply
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: __STORAGE_CLASS__
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: diskplugin.csi.alibabacloud.com
allowVolumeExpansion: true
reclaimPolicy: Retain
# 云盘有可用区属性，必须等 Pod 调度后按节点所在 AZ 创建
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: cloud_essd            # ESSD 云盘
  fstype: ext4
  performanceLevel: PL1       # 按需 PL0/PL1/PL2/PL3
  encrypted: "true"           # 云盘加密（静态加密）
  diskTags: "app-storage"
