# 规范 StorageClass（drill/KVM）：所有平台 PVC 统一引用 app-storage
# 由 storage/apply.sh 渲染 __STORAGE_CLASS__ / __LONGHORN_REPLICAS__ 后 apply
# 生产环境切换见 storage/alicloud/storageclass.yaml（同名 SC，后端不同）
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: __STORAGE_CLASS__
  annotations:
    # 作为集群默认 SC；Longhorn chart 自带 longhorn SC 在 values-overlay 中关闭为默认
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain          # 防误删 PV 连带数据
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "__LONGHORN_REPLICAS__"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "best-effort"  # 优先本地副本，兼顾性能与可用性
  disableRevisionCounter: "false"
  # 从 Longhorn 备份恢复时可用 fromBackup 指定 backup URL
