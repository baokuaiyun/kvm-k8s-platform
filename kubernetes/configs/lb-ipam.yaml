# 业务按需 IP 池（功能②）：Cilium LB IPAM + L2 公告
#   渲染: make cni（自动 envsubst 替换 EFF_LB_POOL_START / EFF_LB_POOL_END / EFF_BIZ_IFACE）
#   前提: Cilium 需开启 l2announcements.enabled=true（见 cilium-values.yaml）
#   说明: Service type=LoadBalancer 默认从池【按需自动分配】IP；固定用注解 io.cilium/lb-ipam-ips
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: biz-pool
spec:
  blocks:
    - start: ${EFF_LB_POOL_START}
      stop: ${EFF_LB_POOL_END}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: biz-l2
spec:
  # 业务网卡（双网卡时的 enp2s0；单网段时=管理网卡）
  interfaces:
    - ${EFF_BIZ_IFACE}
  externalIPs: false
  loadBalancerIPs: true
