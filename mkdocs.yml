site_name: KVM K8s 生产集群平台
site_description: 基于 KVM + kubeadm 的可复现生产级 Kubernetes 集群，支持三模式多租户
site_url: https://baokuaiyun.com
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 默认会剥掉中文导致锚点变成 #_1/#_2；改用 pymdownx 保留 Unicode，锚点可读
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 实施矩阵(总纲): implementation-matrix.md
  - 集群类型(管理/生产分离): cluster-types.md
  - 仓拓扑与跨仓契约(分仓骨架): repo-topology.md
  - 参数设置说明: parameters.md
  - 状态账本(进度源): state-ledger.md
  - 四平面完成定义(DoD): plane-dod.md
  - 身份映射(OIDC): identity-mapping.md
  - GitOps Fleet(Flux Operator): gitops-fleet.md
  - 引导顺序(两平面+按需制品): bootstrap-order.md
  - 数据来源(local/shared): data-source.md
  - 数据平面管理: data-plane-management.md
  - 实施状态总览: implementation-status.md
  - 实施手册(命令详解): implementation-playbook.md
  - 环境差异: environment-differences.md
  - 阿里云部署: alicloud-deployment.md
  - 域名/证书迁移: baokuaiyun-domain-migration.md
  - 多租户架构: tenant-isolation-architecture.md
  - Makefile 设计: makefile-design.md
  - 镜像管道(本域 Harbor): image-pipeline.md
  - 网络架构与 LB 设计: network-architecture.md
  - 网络验证(工具/教程): network-verification.md
  - 服务/业务 IP 设计(固定入口+按需池): service-ip-design.md
  - 生产同构入口(Gateway): access-gateway.md
  - Helm Chart 分发: helm-chart-distribution.md
  - ACR 镜像同步(旧): acr-image-sync.md
  - 存储规划(SC/PV/云盘): storage-plan.md
  - 云盘数据方案(ZFS+iSCSI 云盘/计算分离): cloud-disk-data-solution.md
  - 验收与证据(Proof): evidence-and-acceptance.md
  - Longhorn 引擎镜像迁移/恢复: longhorn-engine-image-migration.md
  - 应用数据与备份: application-data.md
  - 数据分级: data-classification.md
  - 凭据管理: secret-management.md
  - 共享数据层(PG/Redis): platform-data.md
  - 统一用户管理(Casdoor): identity-sso-casdoor.md
