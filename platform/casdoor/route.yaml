apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: casdoor
  namespace: casdoor
spec:
  parentRefs:
    - name: kgateway
      namespace: kgateway-system
  hostnames:
    - __CASDOOR_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: casdoor
          port: 8000
