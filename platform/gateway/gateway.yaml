apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway
spec:
  gatewayClassName: kgateway
  # 功能①：平台入口 L7 共享固定 IP（由 up-core.sh 用 EFF_GATEWAY_VIP 渲染 __GATEWAY_VIP__）
  addresses:
    - type: IPAddress
      value: __GATEWAY_VIP__
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.test.baokuaiyun.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-test-tls
      allowedRoutes:
        namespaces:
          from: All
