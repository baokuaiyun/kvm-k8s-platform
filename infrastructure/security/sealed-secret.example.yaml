# Sealed-Secrets 示例（占位密文，需用 kubeseal 重新生成真实密文后使用）
# 参考 docs/secret-management.md
#
# 生成方式：
#   kubectl -n platform-data create secret generic harbor-pg-cred \
#     --from-literal=username=harbor --from-literal=password='<REAL>' \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=kube-system -o yaml > infrastructure/security/sealed/harbor-pg-cred.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-pg-cred
  namespace: platform-data
spec:
  encryptedData:
    username: <BASE64-ENCRYPTED-BY-KUBESEAL>
    password: <BASE64-ENCRYPTED-BY-KUBESEAL>
  template:
    metadata:
      name: harbor-pg-cred
      namespace: platform-data
    type: Opaque
